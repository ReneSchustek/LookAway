name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: 'Release'
  SOLUTION_FILE: 'LookAway.slnx'

jobs:
  build-test:
    name: Build, Test, Security-Scan
    # WinUI 3 / Windows App SDK setzt einen Windows-Runner voraus.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore workloads (Windows App SDK)
        # 'dotnet workload restore' liest die Anforderungen aus den Projekten
        # und installiert nur, was tatsächlich gebraucht wird.
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        # TreatWarningsAsErrors greift global über Directory.Build.props.
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        # 'trx'-Logger ohne fixen Dateinamen → dotnet legt pro Test-Projekt
        # eine eigene Datei an (sonst überschreibt das zweite Projekt das erste).
        # --blame-hang bricht einen blockierten Test-Host nach 5 Minuten ab und nennt
        # den laufenden Test. Ohne das läuft ein Hänger stumm ins Job-Timeout.
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger trx
          --logger "console;verbosity=normal"
          --results-directory test-results
          --collect "XPlat Code Coverage"
          --blame-hang
          --blame-hang-timeout 5m

      - name: Security-Scan (review.ps1)
        # Lokales Pattern-Audit aus tools/review.ps1 — ergänzt die Compiler-Analyzer
        # um zusätzliche Heuristiken (Secrets, Console.WriteLine, BinaryFormatter, ...).
        shell: pwsh
        run: ./tools/review.ps1 -Mode security

      # Die READMEs nennen die aktuelle Version im Abschnitt "Aktuelles Release". Sie stand
      # dort auf v1.1.1, während v1.2.8 veröffentlicht war — eine Angabe, die niemand prüft,
      # veraltet zuverlässig. Der Abgleich gegen Directory.Build.props kostet Sekunden.
      - name: Doku-Abgleich (README-Version)
        shell: pwsh
        run: ./tools/review.ps1 -Mode docs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/**/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: xUnit Tests
          # Relativer Forward-Slash-Glob: ein absoluter Windows-Pfad (Backslashes)
          # bringt die Glob-Bibliothek von test-reporter dazu, keine Datei zu finden.
          path: test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  release:
    name: Release-Artefakte (Tag-Push)
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore workloads (Windows App SDK)
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Versionsnummer aus Tag ableiten
        id: version
        shell: pwsh
        # 'v1.2.3' → '1.2.3'
        run: echo "value=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Portable-Artefakt erstellen
        shell: pwsh
        run: ./tools/publish-portable.ps1 -Version ${{ steps.version.outputs.value }}

      # Der Installer gehört an das Release, nicht nur in die Anleitung: Wer LookAway
      # nicht portable betreibt, soll ihn nicht selbst kompilieren müssen. Inno Setup
      # ist auf dem windows-latest-Image vorhanden; publish-setup.ps1 sucht es über
      # Standardpfad und PATH und bricht mit klarer Meldung ab, falls es fehlt.
      - name: Setup.exe erstellen
        shell: pwsh
        run: ./tools/publish-setup.ps1 -Version ${{ steps.version.outputs.value }}

      # Bewusst nur das ZIP: Der Updater greift sich die erste '.sig' im Release. Eine
      # zweite Signatur — etwa für die Setup.exe — würde er womöglich als Signatur des
      # Pakets lesen und die Prüfung fehlschlagen lassen. Die Setup.exe weist stattdessen
      # ihren SHA-256 im Release-Text aus.
      - name: Portable-Paket signieren (falls Schlüssel hinterlegt)
        # Signiert das ZIP mit dem offline gehaltenen Release-Schlüssel, sofern er als
        # Repository-Secret LOOKAWAY_SIGNING_KEY (privates PKCS#8-PEM) hinterlegt ist.
        # Ohne Secret bleibt das Paket unsigniert; der Auto-Updater weist es dann ab
        # (fail-closed). Alternative ohne Secret: lokal mit tools/sign-release.ps1
        # signieren und die .sig-Datei manuell an das Release anhängen.
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.LOOKAWAY_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            Write-Host 'Kein Signaturschlüssel hinterlegt — Paket bleibt unsigniert.'
            exit 0
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'lookaway-signing-key.pem'
          Set-Content -LiteralPath $keyPath -Value $env:SIGNING_KEY -NoNewline
          try {
            ./tools/sign-release.ps1 -PackagePath "dist/LookAway-Portable-v${{ steps.version.outputs.value }}.zip" -KeyPath $keyPath
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      # Ohne Code-Signing-Zertifikat ist der Hash die einzige Kontrolle, die ein Nutzer
      # gegen ein manipuliertes Archiv in der Hand hat. Er gehört deshalb sichtbar in den
      # Release-Text, nicht nur ins Job-Protokoll.
      - name: SHA-256 der Artefakte ermitteln
        id: hashes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $setup    = "dist/LookAway-Setup-v$version.exe"
          $portable = "dist/LookAway-Portable-v$version.zip"
          foreach ($datei in @($setup, $portable)) {
              if (-not (Test-Path -LiteralPath $datei)) { throw "Artefakt fehlt: $datei" }
          }
          "setup=$((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "portable=$((Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          # Der Glob '...zip*' lädt das Paket und – falls vorhanden – die '.sig' mit hoch,
          # die Setup.exe kommt als eigener Eintrag dazu.
          files: |
            dist/LookAway-Portable-v${{ steps.version.outputs.value }}.zip*
            dist/LookAway-Setup-v${{ steps.version.outputs.value }}.exe
          generate_release_notes: true
          # Steht vor den generierten Notizen.
          body: |
            ## Downloads

            - **LookAway-Setup-v${{ steps.version.outputs.value }}.exe** — Installer (Inno Setup): freie Wahl des Zielordners, Startmenü-Eintrag, optionaler Autostart.
            - **LookAway-Portable-v${{ steps.version.outputs.value }}.zip** — portable Variante, entpacken und starten. Alle Daten liegen neben der EXE.

            Die automatische Update-Funktion verwendet weiterhin die portable ZIP samt beiliegender Signatur (`.zip.sig`).

            ## Integritätsprüfung

            Die Builds tragen kein CA-Zertifikat; SmartScreen kann beim ersten Start warnen. Prüfbar sind sie über den SHA-256:

            ```
            SHA256 (LookAway-Setup-v${{ steps.version.outputs.value }}.exe)     ${{ steps.hashes.outputs.setup }}
            SHA256 (LookAway-Portable-v${{ steps.version.outputs.value }}.zip)  ${{ steps.hashes.outputs.portable }}
            ```
