name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wöchentlicher Security-Scan, damit neue CVEs in unveränderten Abhängigkeiten
    # auch ohne Push gefunden werden. Sonntag 04:00 UTC liegt außerhalb der üblichen
    # Arbeitszeit und kollidiert nicht mit den Push-Läufen der Woche.
    - cron: '0 4 * * 0'

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Solution bauen (App wird per Projekt-Mapping als x64 gebaut, damit CodeQL die Assemblies analysieren kann)
        run: |
          dotnet restore LookAway.slnx
          dotnet build LookAway.slnx --no-restore

      - name: CodeQL-Analyse durchführen
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'

  dependency-review:
    name: Dependency Review (SCA)
    runs-on: ubuntu-latest
    # Die Prüfung vergleicht zwei Stände miteinander. Beim Pull Request kennt die Aktion beide
    # selbst, beim Push auf main müssen sie übergeben werden. Ein neu angelegter Branch hat keinen
    # Vorgänger (Null-SHA) und wird deshalb ausgenommen. Beim Zeitplan-Lauf und bei einer
    # Handauslösung gibt es keinen Diff — dort prüfen der Vollstand-Check des Jobs
    # „NuGet Vulnerability Audit" (dotnet list package --vulnerable) und die Dependabot-Alerts,
    # die neue Advisories auch ohne Lauf melden.
    # Die Sichtbarkeits-Bedingung sichert gegen einen späteren Wechsel auf privat ab: dort verlangt
    # die Aktion Advanced Security und bricht sonst ab.
    if: >-
      github.event.repository.visibility == 'public'
      && (github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'))
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: Abhängigkeiten eines Pull Requests prüfen
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

      - name: Abhängigkeiten des veröffentlichten Standes prüfen
        if: github.event_name == 'push'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}

  vulnerable-packages:
    name: NuGet Vulnerability Audit (SCA)
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore LookAway.slnx

      - name: Vulnerable-Packages-Check (transitives Schließen, hartes Gate)
        shell: pwsh
        run: |
          $output = dotnet list LookAway.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match 'has the following vulnerable packages') {
            Write-Host '::error::Vulnerable NuGet-Pakete gefunden — Build hart abgebrochen.'
            exit 1
          }

      - name: Deprecated-Packages-Check (Warnung, kein Fail)
        shell: pwsh
        continue-on-error: true
        run: dotnet list LookAway.slnx package --deprecated --include-transitive

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks ausführen
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
