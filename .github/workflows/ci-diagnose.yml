name: CI-Diagnose (App.Tests-Hänger)

# Temporärer Workflow: sichert einen Hang-Dump des blockierten Test-Hosts, damit der
# Stack zeigt, worauf der Modul-Initialisierer von LookAway.App wartet.
# Wird nach der Klärung wieder entfernt.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: 'Release'
  SOLUTION_FILE: 'LookAway.slnx'

jobs:
  hangdump:
    name: Hang-Dump sichern
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet workload restore ${{ env.SOLUTION_FILE }}
      - run: dotnet restore ${{ env.SOLUTION_FILE }}
      - run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

      # Unveränderte Runner-Umgebung (kein Runtime-Install) — das ist der echte CI-Fall.
      - name: Nur App.Tests, Hang-Dump nach 2 Minuten
        # -p:Platform=x64 muss mit dem Solution-Build übereinstimmen, sonst sucht
        # --no-build die Assembly unter bin/ statt bin/x64/ und findet sie nicht.
        run: >
          dotnet test tests/LookAway.App.Tests/LookAway.App.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          -p:Platform=x64
          --logger "console;verbosity=normal"
          --blame-hang
          --blame-hang-timeout 120s
          --blame-hang-dump-type full

      - name: Dump sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hangdump
          path: tests/LookAway.App.Tests/TestResults/**/*
          if-no-files-found: warn
          retention-days: 7
