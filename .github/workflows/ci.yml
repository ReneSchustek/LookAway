name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: 'Release'
  SOLUTION_FILE: 'LookAway.slnx'

jobs:
  build-test:
    name: Build, Test, Security-Scan
    # WinUI 3 / Windows App SDK setzt einen Windows-Runner voraus.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore workloads (Windows App SDK)
        # 'dotnet workload restore' liest die Anforderungen aus den Projekten
        # und installiert nur, was tatsaechlich gebraucht wird.
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        # TreatWarningsAsErrors greift global ueber Directory.Build.props.
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        # 'trx'-Logger ohne fixen Dateinamen → dotnet legt pro Test-Projekt
        # eine eigene Datei an (sonst ueberschreibt das zweite Projekt das erste).
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger trx
          --logger "console;verbosity=normal"
          --results-directory test-results
          --collect "XPlat Code Coverage"

      - name: Security-Scan (review.ps1)
        # Lokales Pattern-Audit aus tools/review.ps1 — ergaenzt die Compiler-Analyzer
        # um zusaetzliche Heuristiken (Secrets, Console.WriteLine, BinaryFormatter, ...).
        shell: pwsh
        run: ./tools/review.ps1 -Mode security

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/**/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: xUnit Tests
          # Relativer Forward-Slash-Glob: ein absoluter Windows-Pfad (Backslashes)
          # bringt die Glob-Bibliothek von test-reporter dazu, keine Datei zu finden.
          path: test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  release:
    name: Release-Artefakte (Tag-Push)
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore workloads (Windows App SDK)
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Versionsnummer aus Tag ableiten
        id: version
        shell: pwsh
        # 'v1.2.3' → '1.2.3'
        run: echo "value=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Portable-Artefakt erstellen
        shell: pwsh
        run: ./tools/publish.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/LookAway-Portable-v${{ steps.version.outputs.value }}.zip
          generate_release_notes: true
